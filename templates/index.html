<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Score Prediction</title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>

    <div class="container">

        <div class="card">

            <h1>Student Score Prediction</h1>

            <p class="subtitle">
                Predict the student's final score using Linear Regression
            </p>


            <form id="predictionForm">


                <!-- Hours Studied -->

                <div class="form-group">

                    <label for="hours_studied">
                        Hours Studied
                    </label>

                    <input
                        type="number"
                        id="hours_studied"
                        placeholder="Example: 6"
                        min="0"
                        max="24"
                        step="0.1"
                        required
                    >

                </div>


                <!-- Previous Score -->

                <div class="form-group">

                    <label for="previous_score">
                        Previous Score
                    </label>

                    <input
                        type="number"
                        id="previous_score"
                        placeholder="Example: 75"
                        min="0"
                        max="100"
                        step="0.1"
                        required
                    >

                </div>


                <!-- Attendance -->

                <div class="form-group">

                    <label for="attendance">
                        Attendance (%)
                    </label>

                    <input
                        type="number"
                        id="attendance"
                        placeholder="Example: 85"
                        min="0"
                        max="100"
                        step="0.1"
                        required
                    >

                </div>


                <!-- Sleep Hours -->

                <div class="form-group">

                    <label for="sleep_hours">
                        Sleep Hours
                    </label>

                    <input
                        type="number"
                        id="sleep_hours"
                        placeholder="Example: 7"
                        min="0"
                        max="24"
                        step="0.1"
                        required
                    >

                </div>


                <!-- Button -->

                <button type="submit">
                    Predict Final Score
                </button>

            </form>


            <!-- Result -->

            <div id="result" class="result">

                <h2>Prediction Result</h2>

                <p>
                    Predicted Final Score:
                    <span id="predictedScore">--</span>
                </p>

            </div>

        </div>

    </div>


    <script src="/static/script.js"></script>

</body>

</html>
